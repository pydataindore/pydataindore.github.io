# ============================================================
#  Site-wide settings  (available everywhere as {{ site.* }})
# ============================================================
title: "PyData Indore | Data Science Community"
description: "Central India's community for data scientists, ML practitioners, and open-source enthusiasts. Part of the global PyData network."
url: "https://indore.pydata.org"

# ============================================================
#  Defaults — applied to every page so each page's front
#  matter only needs the bits that are unique to it.
# ============================================================
defaults:
  - scope:
      path: ""           # everything
    values:
      layout: default                                   # use _layouts/default.html
      image: /Assets/images/pydata_banner_logo.jpeg     # default social-share image

# ============================================================
#  Local dev server (jekyll serve / WEBrick) — never cache assets
#  so edits always show up without a hard refresh. No effect on
#  the production GitHub Pages build.
# ============================================================
webrick:
  headers:
    Cache-Control: "no-store, no-cache, must-revalidate, max-age=0"
    Pragma: "no-cache"

# ============================================================
#  Build settings
# ============================================================
# Files Jekyll should NOT copy into the built site.
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore
